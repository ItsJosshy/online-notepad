<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A quiet space for your thoughts. A simple, self-hosted notebook that saves as you write."
    />
    <title>Still — A little space to think</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <svg
      class="icon-library"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8" />
        <path d="m16 16 4.5 4.5" />
      </symbol>
      <symbol id="i-note" viewBox="0 0 24 24">
        <path
          d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"
        />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="m16 3 5 5-4 1-3 5v3l-7-7h3l5-3zM10 14l-6 6" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7" />
      </symbol>
      <symbol id="i-focus" viewBox="0 0 24 24">
        <path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-6-6 6 6-6 6" />
      </symbol>
    </svg>
    <div class="starfield" aria-hidden="true"></div>
    <div class="workspace">
      <aside class="sidebar" aria-label="Notebook">
        <header class="sidebar-header">
          <span
            id="note-count"
            class="visually-hidden"
            aria-label="Number of notes"
            >0</span
          >
          <button
            id="new-note"
            class="icon-button"
            aria-label="New note"
            title="New note (N)"
          >
            <svg><use href="#i-plus" /></svg>
          </button>
        </header>
        <label class="search" hidden>
          <svg><use href="#i-search" /></svg>
          <input
            id="search"
            type="search"
            placeholder="Search notes"
            aria-label="Search notes"
          />
          <kbd id="search-shortcut">⌘ K</kbd>
        </label>
        <nav id="note-list" class="note-list" aria-label="Notes"></nav>
        <div id="list-empty" class="list-empty" hidden>No notes found.</div>
      </aside>
      <button
        id="sidebar-backdrop"
        class="sidebar-backdrop"
        aria-label="Close notebook"
      ></button>
      <main class="main">
        <header class="topbar" aria-label="Note controls">
          <div class="toolbar-start">
            <button
              id="mobile-menu"
              class="icon-button"
              aria-label="Toggle notebook"
              aria-expanded="false"
            >
              <svg><use href="#i-menu" /></svg>
            </button>
            <div
              id="save-status"
              class="save-status"
              role="status"
              aria-live="polite"
              data-state="saved"
              hidden
            >
              <svg><use href="#i-check" /></svg
              ><span id="save-label">Saved</span>
            </div>
          </div>
          <div class="toolbar-end">
            <div id="note-actions" class="note-actions" hidden>
              <button
                id="pin"
                class="icon-button"
                aria-label="Pin note"
                title="Pin note"
                aria-pressed="false"
              >
                <svg><use href="#i-pin" /></svg>
              </button>
              <button
                id="export"
                class="icon-button"
                aria-label="Download note"
                title="Download as text"
              >
                <svg><use href="#i-download" /></svg>
              </button>
              <button
                id="delete"
                class="icon-button delete-button"
                aria-label="Delete note"
                title="Delete note"
              >
                <svg><use href="#i-trash" /></svg>
              </button>
            </div>
            <button
              id="focus"
              class="icon-button"
              title="Focus mode"
              aria-label="Enter focus mode"
              aria-pressed="false"
            >
              <svg><use href="#i-focus" /></svg>
            </button>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden>
          <span id="notice-text"></span
          ><button id="retry" hidden>Retry save</button>
        </div>
        <section id="editor" class="editor" aria-label="Note editor" hidden>
          <textarea
            id="content"
            class="note-content"
            aria-label="Note content"
            spellcheck="true"
            maxlength="500000"
          ></textarea>
        </section>
        <section id="empty-state" class="empty-state" hidden>
          <p>No notes yet</p>
          <button id="empty-new" class="primary-button">
            <svg><use href="#i-plus" /></svg>New note
          </button>
        </section>
        <div id="loading" class="loading">Loading notes…</div>
      </main>
    </div>
    <dialog id="delete-dialog">
      <form method="dialog">
        <h2>Delete this note?</h2>
        <p>This cannot be undone.</p>
        <div class="dialog-actions">
          <button value="cancel" class="secondary-button">Keep note</button>
          <button value="delete" class="danger-button">Delete note</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
